[build]
  command = "node scripts/parse-articles.mjs && node scripts/generate-sitemap.mjs && npx vite build && node scripts/post-build.mjs"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

# 静态资源缓存（1年）
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# images 目录图片缓存（1年）
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 根目录图片缓存（1年）
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 文章图片缓存（1年）
[[headers]]
  for = "/article-images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 教师图片缓存（1年）
[[headers]]
  for = "/teachers/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 字体缓存（1年）
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 音频缓存（1年）
[[headers]]
  for = "/*.m4a"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 安全头
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
